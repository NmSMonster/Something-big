<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cień Miasta</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;user-select:none;font-family:'Courier Prime','Courier New',monospace}
  canvas#bg{position:fixed;inset:0;width:100%;height:100%}
  #scene{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;pointer-events:none}

  /* ---- logo ---- */
  #logo{position:absolute;left:19%;top:14%;display:flex;align-items:flex-start;gap:28px;animation:drop 1.1s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes drop{from{transform:translateY(-120vh) rotate(-6deg)}to{transform:none}}
  .brick{width:150px;height:150px;background:#e3000b;border-radius:6px;display:grid;place-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 -8px 0 #a50008,inset 0 6px 0 #ff3b3b}
  .brick span{font:italic 900 56px/1 'Arial Black',Impact,sans-serif;color:#fff;letter-spacing:-2px;
    -webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 0 0 #ffd400,3px 3px 0 #ffd400}
  .title{display:flex;flex-direction:column}
  .title h1{margin:0;font:400 140px/1 Bangers,Impact,sans-serif;color:#ffd400;letter-spacing:4px;transform:skew(-8deg);
    -webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:5px 5px 0 #000,8px 8px 0 #e3000b;}
  .title h1 small{font-size:.52em;letter-spacing:6px;color:#ffe25a}
  .title h2{margin:8px 0 0;font:400 34px/1 'Courier Prime',monospace;color:#fff;letter-spacing:.42em;border-top:3px solid #fff;padding-top:10px;
    text-shadow:0 0 10px #8fb3ff}

  /* ---- menu ---- */
  #menu{position:absolute;left:34%;top:64%;list-style:none;margin:0;padding:0;pointer-events:auto;text-align:right}
  #menu li{font-size:40px;font-weight:700;color:#e9a21b;cursor:pointer;line-height:1.3;transition:.15s;
    -webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000;transform-origin:right center;opacity:0;animation:fade .5s both}
  #menu li:nth-child(1){animation-delay:.8s}#menu li:nth-child(2){animation-delay:.95s}#menu li:nth-child(3){animation-delay:1.1s}#menu li:nth-child(4){animation-delay:1.25s}
  @keyframes fade{from{opacity:0;transform:translateX(-40px)}to{opacity:1}}
  #menu li.sel{color:#fff;transform:scale(1.12);text-shadow:3px 3px 0 #000,0 0 22px #ffd400}
  #menu li.sel::before{content:'▶ ';color:#ffd400;font-size:.7em}

  #select{position:absolute;right:40px;bottom:22px;font-size:30px;font-weight:700;color:#7cff6a;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:2px 2px 0 #000}
  #select b{display:inline-block;width:44px;height:44px;border-radius:50%;background:#1d8f2b;color:#fff;text-align:center;line-height:44px;box-shadow:inset 0 -5px 0 #0d5a17,0 0 12px #3fff4a;margin-left:8px;font-size:26px}

  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s}
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);font-size:52px;color:#ffd400;-webkit-text-stroke:3px #000;paint-order:stroke fill;opacity:0;transition:.3s;pointer-events:none;font-family:Bangers,Impact,sans-serif;letter-spacing:3px}
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

  @media (max-width:1100px){
    #logo{left:6%;top:8%;transform-origin:left top;scale:.65}
    #menu{left:6%;top:62%;text-align:left}
    #menu li{transform-origin:left center;font-size:30px}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="scene">
  <div id="logo">
    <div class="brick"><span>BRIX</span></div>
    <div class="title"><h1>CIEŃ <small>MIASTA</small></h1><h2>THE VIDEOGAME</h2></div>
  </div>
  <ul id="menu">
    <li class="sel">Nowa gra</li>
    <li>Wczytaj grę</li>
    <li>Opcje</li>
    <li>Wyjście</li>
  </ul>
  <div id="select">Wybierz <b>A</b></div>
</div>
<div id="toast"></div>
<div id="fade"></div>

<script>
(() => {
const c = document.getElementById('bg'), x = c.getContext('2d');
let W, H, DPR;
const stars = [], rnd = (a, b) => a + Math.random() * (b - a);
let buildings = [];
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.width = innerWidth * DPR; H = c.height = innerHeight * DPR;
  stars.length = 0;
  for (let i = 0; i < 400; i++) stars.push({x: rnd(0, W), y: rnd(0, H), r: rnd(.4, 1.6) * DPR, p: rnd(0, 7)});
  buildings = [];
  for (let bx = -50; bx < W + 200; bx += rnd(90, 200) * DPR){
    const bw = rnd(80, 190) * DPR, bh = rnd(.12, .45) * H;
    const win = [];
    for (let wy = 14 * DPR; wy < bh - 10 * DPR; wy += 26 * DPR) for (let wx = 10 * DPR; wx < bw - 14 * DPR; wx += 24 * DPR) if (Math.random() < .35) win.push([wx, wy, rnd(0, 1)]);
    buildings.push({x: bx, w: bw, h: bh, win, dark: Math.random() < .4});
  }
}
addEventListener('resize', resize); resize();

// ---- minifig drawing (canvas 2D, faux 3D shading) ----
function minifig(cx, baseY, s, t){
  const sway = Math.sin(t * 1.4) * 1.5 * s;
  x.save(); x.translate(cx, baseY);
  // cape (behind)
  x.fillStyle = '#0b0b10';
  x.beginPath(); x.moveTo(-26 * s, -238 * s);
  for (let i = 0; i <= 8; i++){
    const p = i / 8, wave = Math.sin(t * 2.2 + p * 5) * (10 + 26 * p) * s;
    x.lineTo(-26 * s - 60 * s * p + Math.sin(t * .9) * 8 * s, -238 * s + 260 * s * p + Math.abs(wave) * .25);
  }
  for (let i = 8; i >= 0; i--){
    const p = i / 8, wave = Math.cos(t * 2 + p * 4) * (12 + 30 * p) * s;
    x.lineTo(70 * s + 180 * s * p + wave, -236 * s + 250 * s * p);
  }
  x.closePath(); x.fill();
  x.fillStyle = 'rgba(70,70,95,.25)'; x.fill();
  // pedestal
  x.fillStyle = '#14141a'; x.fillRect(-40 * s, 0, 120 * s, 200 * s);
  x.fillStyle = '#26262f'; x.fillRect(-40 * s, 0, 120 * s, 8 * s);
  // legs
  const legG = x.createLinearGradient(-30 * s, 0, 50 * s, 0);
  legG.addColorStop(0, '#5e6273'); legG.addColorStop(.5, '#aeb3c4'); legG.addColorStop(1, '#5e6273');
  x.fillStyle = legG; x.fillRect(-32 * s, -96 * s, 42 * s, 96 * s); x.fillRect(12 * s, -96 * s, 42 * s, 96 * s);
  x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(8 * s, -96 * s, 6 * s, 96 * s);
  // hips
  x.fillStyle = '#3b3e4c'; x.fillRect(-36 * s, -108 * s, 94 * s, 14 * s);
  // torso
  x.save(); x.translate(sway, 0);
  const tG = x.createLinearGradient(-40 * s, 0, 60 * s, 0);
  tG.addColorStop(0, '#6a6e80'); tG.addColorStop(.45, '#b9bfd0'); tG.addColorStop(1, '#606476');
  x.fillStyle = tG;
  x.beginPath(); x.moveTo(-34 * s, -108 * s); x.lineTo(-44 * s, -204 * s); x.lineTo(66 * s, -204 * s); x.lineTo(56 * s, -108 * s); x.closePath(); x.fill();
  // belt
  x.fillStyle = '#f2c200'; x.fillRect(-36 * s, -126 * s, 92 * s, 14 * s);
  x.fillStyle = '#c99a00'; for (let i = 0; i < 5; i++) x.fillRect((-30 + i * 18) * s, -123 * s, 10 * s, 8 * s);
  // emblem: black oval with yellow shard
  x.fillStyle = '#111'; x.beginPath(); x.ellipse(11 * s, -170 * s, 30 * s, 17 * s, 0, 0, 6.3); x.fill();
  x.fillStyle = '#ffd400'; x.beginPath(); x.moveTo(11 * s, -183 * s); x.lineTo(24 * s, -168 * s); x.lineTo(11 * s, -157 * s); x.lineTo(-2 * s, -168 * s); x.closePath(); x.fill();
  // abs lines
  x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = 2 * s;
  x.beginPath(); x.moveTo(-10 * s, -150 * s); x.lineTo(32 * s, -150 * s); x.moveTo(-8 * s, -140 * s); x.lineTo(30 * s, -140 * s); x.stroke();
  // arms
  function arm(ax, dir){
    x.save(); x.translate(ax, -196 * s); x.rotate(dir * (.55 + Math.sin(t * 1.4) * .04));
    const aG = x.createLinearGradient(-14 * s, 0, 14 * s, 0); aG.addColorStop(0, '#5b5f70'); aG.addColorStop(.5, '#b2b8c8'); aG.addColorStop(1, '#5b5f70');
    x.fillStyle = aG; x.beginPath(); x.roundRect(-14 * s, 0, 28 * s, 80 * s, 10 * s); x.fill();
    // hand (C clip)
    x.translate(0, 84 * s); x.rotate(-dir * .9);
    x.fillStyle = '#111'; x.beginPath(); x.roundRect(-10 * s, -2 * s, 20 * s, 16 * s, 4 * s); x.fill();
    x.strokeStyle = '#111'; x.lineWidth = 8 * s; x.beginPath(); x.arc(0, 24 * s, 11 * s, -.3, 3.4); x.stroke();
    x.restore();
  }
  arm(-40 * s, -1); arm(62 * s, 1);
  // neck
  x.fillStyle = '#222'; x.fillRect(-2 * s, -216 * s, 26 * s, 14 * s);
  // head (cylinder) with hood + mask
  const hG = x.createLinearGradient(-30 * s, 0, 52 * s, 0); hG.addColorStop(0, '#111'); hG.addColorStop(.5, '#3a3a44'); hG.addColorStop(1, '#0d0d12');
  x.fillStyle = hG; x.beginPath(); x.roundRect(-28 * s, -300 * s, 78 * s, 90 * s, 18 * s); x.fill();
  // face (skin visible below mask)
  x.fillStyle = '#e8b98a'; x.fillRect(-18 * s, -244 * s, 58 * s, 28 * s);
  x.fillStyle = '#111'; x.fillRect(-8 * s, -230 * s, 38 * s, 4 * s); // mouth
  // mask bottom edge shadow
  x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(-18 * s, -246 * s, 58 * s, 4 * s);
  // eyes (glowing white slits)
  x.shadowColor = '#9fd3ff'; x.shadowBlur = 14 * s; x.fillStyle = '#fff';
  x.beginPath(); x.ellipse(-2 * s, -262 * s, 11 * s, 5 * s, -.2, 0, 6.3); x.fill();
  x.beginPath(); x.ellipse(24 * s, -262 * s, 11 * s, 5 * s, .2, 0, 6.3); x.fill();
  x.shadowBlur = 0;
  // ears / hood points
  x.fillStyle = '#111';
  x.beginPath(); x.moveTo(-20 * s, -292 * s); x.lineTo(-16 * s, -330 * s); x.lineTo(6 * s, -298 * s); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(42 * s, -292 * s); x.lineTo(38 * s, -330 * s); x.lineTo(16 * s, -298 * s); x.closePath(); x.fill();
  // stud on top
  x.fillStyle = '#2a2a33'; x.beginPath(); x.ellipse(11 * s, -300 * s, 14 * s, 5 * s, 0, 0, 6.3); x.fill();
  x.restore(); x.restore();
}

let t0 = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const t = (now - t0) / 1000;
  // sky
  const sky = x.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#02030c'); sky.addColorStop(1, '#0a0f24');
  x.fillStyle = sky; x.fillRect(0, 0, W, H);
  // stars
  for (const s of stars){ x.globalAlpha = .5 + .5 * Math.sin(t * 2 + s.p); x.fillStyle = '#fff'; x.fillRect(s.x, s.y, s.r, s.r); }
  x.globalAlpha = 1;
  // moon
  const mx = W * .56, my = H * .42, mr = Math.min(W, H) * .42;
  const halo = x.createRadialGradient(mx, my, mr * .9, mx, my, mr * 1.5); halo.addColorStop(0, 'rgba(120,160,255,.35)'); halo.addColorStop(1, 'transparent');
  x.fillStyle = halo; x.fillRect(0, 0, W, H);
  const mg = x.createRadialGradient(mx - mr * .3, my - mr * .3, mr * .1, mx, my, mr);
  mg.addColorStop(0, '#dfe8ff'); mg.addColorStop(.6, '#8ea6e0'); mg.addColorStop(1, '#3b4f8f');
  x.fillStyle = mg; x.beginPath(); x.arc(mx, my, mr, 0, 6.3); x.fill();
  // craters (deterministic)
  x.save(); x.beginPath(); x.arc(mx, my, mr, 0, 6.3); x.clip();
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 60; i++){
    const a = r() * 6.28, d = r() * mr * .95, cr = (r() * .12 + .02) * mr;
    const cx2 = mx + Math.cos(a) * d, cy2 = my + Math.sin(a) * d;
    x.fillStyle = 'rgba(40,60,120,.35)'; x.beginPath(); x.arc(cx2, cy2, cr, 0, 6.3); x.fill();
    x.fillStyle = 'rgba(220,230,255,.25)'; x.beginPath(); x.arc(cx2 - cr * .25, cy2 - cr * .25, cr * .7, 0, 6.3); x.fill();
  }
  x.restore();
  // city
  for (const b of buildings){
    x.fillStyle = b.dark ? '#05060c' : '#0c0f1c'; x.fillRect(b.x, H - b.h, b.w, b.h);
    for (const [wx, wy, p] of b.win){
      const on = Math.sin(t * .4 + p * 40) > -.6;
      x.fillStyle = on ? `rgba(255,220,130,${.5 + .4 * p})` : '#151826'; x.fillRect(b.x + wx, H - b.h + wy, 12 * DPR, 16 * DPR);
    }
  }
  // searchlight sweep
  x.save(); x.globalCompositeOperation = 'lighter';
  const sl = x.createLinearGradient(0, H, 0, 0); sl.addColorStop(0, 'rgba(160,190,255,.22)'); sl.addColorStop(1, 'transparent');
  x.fillStyle = sl; x.translate(W * .12, H); x.rotate(Math.sin(t * .35) * .5 - .2);
  x.beginPath(); x.moveTo(0, 0); x.lineTo(-W * .1, -H * 1.3); x.lineTo(W * .1, -H * 1.3); x.closePath(); x.fill();
  x.restore();
  // ground fog
  const fog = x.createLinearGradient(0, H * .75, 0, H); fog.addColorStop(0, 'transparent'); fog.addColorStop(1, 'rgba(0,0,0,.85)');
  x.fillStyle = fog; x.fillRect(0, 0, W, H);
  // hero
  minifig(W * .58, H * .97, Math.min(W, H) / 640, t);
}
requestAnimationFrame(frame);

// ---- menu logic + sounds ----
const items = [...document.querySelectorAll('#menu li')];
let idx = 0, AC;
function beep(f, d = .08, type = 'square', v = .08){
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
}
function select(i, sound = true){
  idx = (i + items.length) % items.length;
  items.forEach((el, j) => el.classList.toggle('sel', j === idx));
  if (sound) beep(520, .06);
}
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 1400);
}
function confirm(){
  beep(660, .1, 'square', .1); setTimeout(() => beep(990, .18, 'square', .1), 90);
  const name = items[idx].textContent;
  if (idx === 0){ document.getElementById('fade').style.opacity = 1; setTimeout(() => location.href = 'index.html', 950); }
  else if (idx === 3){ document.getElementById('fade').style.opacity = 1; setTimeout(() => toast('Do zobaczenia!'), 900); }
  else toast(name + ' — wkrótce');
}
items.forEach((el, i) => { el.onmouseenter = () => select(i); el.onclick = confirm; });
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 's') select(idx + 1);
  if (e.key === 'ArrowUp' || e.key === 'w') select(idx - 1);
  if (e.key === 'Enter' || e.key === ' ' || e.key.toLowerCase() === 'a') confirm();
});
addEventListener('gamepadconnected', () => {
  let last = 0; (function poll(){
    const gp = navigator.getGamepads()[0]; if (gp){
      const y = gp.axes[1], now = performance.now();
      if (now - last > 220){ if (y > .5 || gp.buttons[13]?.pressed){ select(idx + 1); last = now; } if (y < -.5 || gp.buttons[12]?.pressed){ select(idx - 1); last = now; } if (gp.buttons[0]?.pressed){ confirm(); last = now + 400; } }
    } requestAnimationFrame(poll); })();
});
})();
</script>
</body>
</html>
